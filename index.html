<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがな Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1927;
    --surface2: #242338;
    --border: #2e2c4a;
    --accent: #e8c547;
    --accent2: #7c6af7;
    --text: #fffffe;
    --muted: #a7a5c6;
    --correct: #4caf82;
    --wrong: #e05c6a;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    background-image: radial-gradient(ellipse at 20% 10%, #1e1a3a 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 90%, #1a2a1e 0%, transparent 60%);
  }

  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }

  .logo {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.4rem;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  .logo span { color: var(--muted); font-size: 0.9rem; margin-left: 8px; }

  /* ── SCREENS ── */
  .screen { width: 100%; max-width: 640px; display: none; flex-direction: column; align-items: center; gap: 24px; }
  .screen.active { display: flex; }

  /* ── HOME ── */
  .home-title {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(2.8rem, 8vw, 4.5rem);
    line-height: 1.1;
    text-align: center;
    color: var(--text);
  }
  .home-title em { color: var(--accent); font-style: normal; }

  .home-sub {
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    max-width: 340px;
  }

  .btn-group { display: flex; gap: 14px; margin-top: 8px; }

  .btn {
    padding: 14px 32px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--accent);
    color: #0f0e17;
  }
  .btn-primary:hover { box-shadow: 0 0 24px rgba(232,197,71,0.4); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--surface); border-color: var(--accent2); }

  /* ── SETTINGS ── */
  .settings-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .settings-title {
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 3px solid var(--bg);
    box-shadow: 0 0 8px rgba(232,197,71,0.5);
  }

  .range-val {
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--accent);
    min-width: 28px;
    text-align: center;
  }

  /* hiragana grid */
  .grid-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    margin-top: 4px;
  }

  .kana-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .kana-btn {
    width: 52px;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .kana-btn .k { font-family: 'Noto Serif JP', serif; font-size: 1.3rem; line-height: 1; }
  .kana-btn .r { font-size: 0.6rem; color: var(--muted); margin-top: 2px; letter-spacing: 0.03em; }

  .kana-btn.on {
    background: rgba(124,106,247,0.18);
    border-color: var(--accent2);
    color: var(--text);
  }
  .kana-btn.on .r { color: var(--accent2); }

  .kana-btn.off {
    opacity: 0.28;
    filter: grayscale(0.5);
  }

  .kana-group-label {
    width: 100%;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
    margin-top: 10px;
    margin-bottom: 2px;
  }

  .grid-actions { display: flex; gap: 10px; margin-top: 12px; }
  .btn-tiny {
    padding: 6px 14px;
    font-size: 0.75rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: 0.15s;
  }
  .btn-tiny:hover { color: var(--text); border-color: var(--accent2); }

  /* ── QUIZ ── */
  .quiz-progress {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .quiz-meta {
    display: flex;
    justify-content: space-between;
    width: 100%;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .quiz-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 180px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .quiz-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(124,106,247,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .quiz-kana {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(4rem, 15vw, 7rem);
    line-height: 1;
    color: var(--text);
    animation: fadeUp 0.3s ease;
  }

  .quiz-romaji {
    font-family: 'DM Mono', monospace;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.05em;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .quiz-hint {
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }

  .options-grid {
    width: 100%;
    display: grid;
    gap: 10px;
  }

  .opt-btn {
    width: 100%;
    padding: 16px 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .opt-btn .opt-romaji {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    color: var(--muted);
  }

  .opt-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent2);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(124,106,247,0.2);
  }

  .opt-btn.correct {
    background: rgba(76,175,130,0.18);
    border-color: var(--correct);
    color: var(--correct);
  }
  .opt-btn.wrong {
    background: rgba(224,92,106,0.18);
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .opt-btn:disabled { cursor: default; transform: none !important; }

  /* results */
  .result-big {
    font-family: 'Noto Serif JP', serif;
    font-size: 5rem;
    line-height: 1;
    color: var(--accent);
  }
  .result-label { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.1em; }
  .result-score {
    font-size: 1.1rem;
    text-align: center;
    line-height: 1.8;
  }

  /* back btn */
  .back-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s;
    align-self: flex-start;
  }
  .back-btn:hover { color: var(--text); }

  .warn {
    color: var(--wrong);
    font-size: 0.82rem;
    text-align: center;
    padding: 10px 16px;
    background: rgba(224,92,106,0.1);
    border: 1px solid rgba(224,92,106,0.3);
    border-radius: 10px;
    display: none;
  }
  .warn.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">ひらがな<span>quiz</span></div>
</header>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="home-title">Learn<br><em>Hiragana</em></div>
  <p class="home-sub">Тренируй японскую азбуку — иероглиф за иероглифом</p>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="startQuiz()">▶ Начать тест</button>
    <button class="btn btn-secondary" onclick="showSettings()">⚙ Настройки</button>
  </div>
</div>

<!-- SETTINGS -->
<div class="screen" id="screen-settings">
  <button class="back-btn" onclick="showHome()">← назад</button>

  <div class="settings-card">
    <div class="settings-title">Вариантов ответа</div>
    <div class="range-row">
      <input type="range" id="opt-count" min="2" max="10" value="4"
             oninput="document.getElementById('opt-val').textContent=this.value">
      <div class="range-val" id="opt-val">4</div>
    </div>
  </div>

  <div class="settings-card">
    <div class="settings-title">Активные иероглифы</div>
    <p class="grid-label">Нажми чтобы включить / выключить</p>
    <div class="kana-grid" id="kana-grid"></div>
    <div class="grid-actions">
      <button class="btn-tiny" onclick="toggleAll(true)">Выбрать все</button>
      <button class="btn-tiny" onclick="toggleAll(false)">Снять все</button>
    </div>
  </div>

  <div class="warn" id="warn-min">Нужно минимум 3 активных иероглифа</div>
  <button class="btn btn-primary" onclick="startQuiz()">▶ Начать тест</button>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <button class="back-btn" onclick="showHome()">← выйти</button>
  <div class="quiz-progress"><div class="quiz-progress-bar" id="q-bar"></div></div>
  <div class="quiz-meta">
    <span id="q-num">1 / 10</span>
    <span id="q-score">✓ 0</span>
  </div>
  <div class="quiz-card">
    <div id="q-display"></div>
  </div>
  <p class="quiz-hint" id="q-hint"></p>
  <div class="options-grid" id="options-grid"></div>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="result-big" id="res-emoji">🎉</div>
  <div class="result-label">РЕЗУЛЬТАТ</div>
  <div class="result-score" id="res-score"></div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="startQuiz()">▶ Ещё раз</button>
    <button class="btn btn-secondary" onclick="showHome()">Меню</button>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────
const HIRAGANA = [
  // group, kana, romaji
  ["あ行", "あ","a"],  ["あ行","い","i"],  ["あ行","う","u"],  ["あ行","え","e"],  ["あ行","お","o"],
  ["か行", "か","ka"], ["か行","き","ki"], ["か行","く","ku"], ["か行","け","ke"], ["か行","こ","ko"],
  ["さ行", "さ","sa"], ["さ行","し","shi"],["さ行","す","su"], ["さ行","せ","se"], ["さ行","そ","so"],
  ["た行", "た","ta"], ["た行","ち","chi"],["た行","つ","tsu"],["た行","て","te"], ["た行","と","to"],
  ["な行", "な","na"], ["な行","に","ni"], ["な行","ぬ","nu"], ["な行","ね","ne"], ["な行","の","no"],
  ["は行", "は","ha"], ["は行","ひ","hi"], ["は行","ふ","fu"], ["は行","へ","he"], ["は行","ほ","ho"],
  ["ま行", "ま","ma"], ["ま行","み","mi"], ["ま行","む","mu"], ["ま行","め","me"], ["ま行","も","mo"],
  ["や行", "や","ya"], ["や行","ゆ","yu"], ["や行","よ","yo"],
  ["ら行", "ら","ra"], ["ら行","り","ri"], ["ら行","る","ru"], ["ら行","れ","re"], ["ら行","ろ","ro"],
  ["わ行", "わ","wa"], ["わ行","を","wo"], ["ん","ん","n"],
];

// ── STATE ──────────────────────────────────────────────────
let active = new Set(HIRAGANA.map((_,i)=>i));
let quizList = [], qIdx = 0, score = 0, totalQ = 10, optCount = 4;

function save() {
  localStorage.setItem('hq_active', JSON.stringify([...active]));
  localStorage.setItem('hq_opts', document.getElementById('opt-count').value);
}
function load() {
  const a = localStorage.getItem('hq_active');
  if (a) active = new Set(JSON.parse(a));
  const o = localStorage.getItem('hq_opts');
  if (o) { document.getElementById('opt-count').value = o; document.getElementById('opt-val').textContent = o; }
}

// ── GRID ──────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('kana-grid');
  grid.innerHTML = '';
  let lastGroup = null;
  HIRAGANA.forEach(([grp, k, r], i) => {
    if (grp !== lastGroup) {
      const lbl = document.createElement('div');
      lbl.className = 'kana-group-label';
      lbl.textContent = grp;
      grid.appendChild(lbl);
      lastGroup = grp;
    }
    const btn = document.createElement('div');
    btn.className = 'kana-btn ' + (active.has(i) ? 'on' : 'off');
    btn.innerHTML = `<span class="k">${k}</span><span class="r">${r}</span>`;
    btn.dataset.idx = i;
    btn.onclick = () => toggleKana(i, btn);
    grid.appendChild(btn);
  });
}

function toggleKana(i, btn) {
  if (active.has(i)) { active.delete(i); btn.className='kana-btn off'; }
  else { active.add(i); btn.className='kana-btn on'; }
  save();
}

function toggleAll(on) {
  if (on) HIRAGANA.forEach((_,i)=>active.add(i));
  else active.clear();
  buildGrid(); save();
}

// ── SCREENS ──────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showHome() { show('screen-home'); }
function showSettings() { buildGrid(); show('screen-settings'); }

// ── QUIZ ──────────────────────────────────────────────────
function startQuiz() {
  const warn = document.getElementById('warn-min');
  optCount = parseInt(document.getElementById('opt-count').value);

  if (active.size < 3) { warn.classList.add('show'); return; }
  warn.classList.remove('show');
  if (active.size < optCount) { optCount = active.size; }

  const pool = [...active];
  quizList = shuffle(pool).slice(0, Math.min(10, pool.length));
  qIdx = 0; score = 0;
  totalQ = quizList.length;
  show('screen-quiz');
  renderQ();
}

function renderQ() {
  const bar = document.getElementById('q-bar');
  bar.style.width = (qIdx / totalQ * 100) + '%';
  document.getElementById('q-num').textContent = `${qIdx+1} / ${totalQ}`;
  document.getElementById('q-score').textContent = `✓ ${score}`;

  const idx = quizList[qIdx];
  const [, kana, romaji] = HIRAGANA[idx];

  // randomly show kana or romaji as prompt
  const showKana = Math.random() < 0.5;
  const display = document.getElementById('q-display');
  const hint = document.getElementById('q-hint');

  if (showKana) {
    display.innerHTML = `<div class="quiz-kana">${kana}</div>`;
    hint.textContent = 'выбери транскрипцию';
  } else {
    display.innerHTML = `<div class="quiz-romaji">${romaji}</div>`;
    hint.textContent = 'выбери иероглиф';
  }

  // build options: correct + random wrong
  const pool = [...active].filter(i => i !== idx);
  const wrongs = shuffle(pool).slice(0, optCount - 1);
  const opts = shuffle([idx, ...wrongs]);

  const grid = document.getElementById('options-grid');
  const cols = optCount <= 4 ? Math.min(optCount, 2) : optCount <= 6 ? 3 : 4;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  opts.forEach(oi => {
    const [, ok, or] = HIRAGANA[oi];
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.idx = oi;
    if (showKana) {
      // вопрос — иероглиф → ответы только транскрипция
      btn.innerHTML = `<span class="opt-romaji">${or}</span>`;
    } else {
      // вопрос — транскрипция → ответы только иероглиф
      btn.innerHTML = `<span>${ok}</span>`;
    }
    btn.onclick = () => answer(btn, oi === idx);
    grid.appendChild(btn);
  });
}

function answer(btn, correct) {
  const grid = document.getElementById('options-grid');
  grid.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (correct) score++;

  // если ошиблись — подсветить правильный
  if (!correct) {
    const correctIdx = quizList[qIdx];
    grid.querySelectorAll('.opt-btn').forEach(b => {
      if (parseInt(b.dataset.idx) === correctIdx) b.classList.add('correct');
    });
  }

  setTimeout(() => {
    qIdx++;
    if (qIdx >= totalQ) showResult();
    else renderQ();
  }, 900);
}

function showResult() {
  document.getElementById('q-bar').style.width = '100%';
  const pct = Math.round(score / totalQ * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 50 ? '😊' : '😅';
  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-score').innerHTML =
    `<strong>${score}</strong> из <strong>${totalQ}</strong> верно<br>${pct}%`;
  show('screen-result');
}

// ── UTILS ──────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ── INIT ──────────────────────────────────────────────────
load();
</script>
</body>
</html>

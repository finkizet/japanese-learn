<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Zen+Kurenaido&family=Kaisei+Decol:wght@400;700&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1927;
    --surface2: #242338;
    --border: #2e2c4a;
    --accent: #e8c547;
    --accent2: #7c6af7;
    --text: #fffffe;
    --muted: #a7a5c6;
    --correct: #4caf82;
    --wrong: #e05c6a;
    --radius: 14px;
    --ui-font: 'Nunito', sans-serif;
    --jp-font: 'Noto Serif JP', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--ui-font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    background-image: radial-gradient(ellipse at 20% 10%, #1e1a3a 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 90%, #1a2a1e 0%, transparent 60%);
  }

  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }

  .logo {
    font-family: var(--jp-font);
    font-size: 1.4rem;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  .logo span { color: var(--muted); font-size: 0.9rem; margin-left: 8px; }

  /* ── SCREENS ── */
  .screen { width: 100%; max-width: 640px; display: none; flex-direction: column; align-items: center; gap: 24px; }
  .screen.active { display: flex; }

  /* ── HOME ── */
  .home-title {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(2.8rem, 8vw, 4.5rem);
    line-height: 1.1;
    text-align: center;
    color: var(--text);
  }
  .home-title em { color: var(--accent); font-style: normal; }

  .home-sub {
    color: var(--muted);
    text-align: center;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    max-width: 340px;
  }

  .btn-group { display: flex; gap: 14px; margin-top: 8px; }

  .btn {
    padding: 14px 32px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: var(--ui-font);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--accent);
    color: #0f0e17;
  }
  .btn-primary:hover { box-shadow: 0 0 24px rgba(232,197,71,0.4); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--surface); border-color: var(--accent2); }

  /* ── SETTINGS ── */
  .settings-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .settings-title {
    font-family: var(--ui-font);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .range-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 3px solid var(--bg);
    box-shadow: 0 0 8px rgba(232,197,71,0.5);
  }

  .range-val {
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--accent);
    min-width: 28px;
    text-align: center;
  }

  /* hiragana grid */
  .grid-label {
    font-family: var(--ui-font);
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 12px;
    margin-top: 4px;
  }

  .kana-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .kana-btn {
    width: 52px;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .kana-btn .k { font-family: var(--jp-font); font-size: 1.3rem; line-height: 1; }
  .kana-btn .r { font-size: 0.6rem; color: var(--muted); margin-top: 2px; letter-spacing: 0.03em; }

  .kana-btn.on {
    background: rgba(124,106,247,0.18);
    border-color: var(--accent2);
    color: var(--text);
  }
  .kana-btn.on .r { color: var(--accent2); }

  .kana-btn.off {
    opacity: 0.28;
    filter: grayscale(0.5);
  }

  .kana-group-label {
    width: 100%;
    font-family: var(--ui-font);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
    margin-top: 14px;
    margin-bottom: 4px;
  }

  .grid-actions { display: flex; gap: 10px; margin-top: 12px; }

  /* ── VIEW TOGGLE ── */
  .kana-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0;
  }
  .view-toggle {
    display: flex;
    gap: 4px;
  }
  .view-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    padding: 0;
    color: var(--accent);
  }
  .view-btn:hover { border-color: var(--accent2); }
  .view-btn.active {
    background: rgba(124,106,247,0.2);
    border-color: var(--accent2);
  }
  .view-btn svg { display: block; }

  /* compact mode — table layout, one row per group */
  .kana-grid.compact {
    display: block;
    gap: 0;
  }
  .kana-grid.compact .kana-group-label { display: none; }
  .kana-row {
    display: none;
    align-items: center;
    gap: 5px;
    margin-bottom: 5px;
  }
  .kana-grid.compact .kana-row { display: flex; }
  .kana-row-label {
    font-family: var(--jp-font);
    font-size: 1rem;
    color: var(--accent);
    width: 28px;
    flex-shrink: 0;
    text-align: center;
  }
  .kana-grid.compact .kana-btn {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .kana-grid.compact .kana-btn .k { font-size: 1.15rem; }
  .kana-grid.compact .kana-btn .r { display: none; }

  /* ── SIDE BY SIDE CARDS ── */
  .settings-row {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .settings-row .settings-card {
    flex: 1;
    min-width: 0;
  }

  /* ── TOOLTIP ── */
  .has-tooltip { position: relative; }
  .has-tooltip::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%);
    background: #2e2c4a;
    color: var(--text);
    font-family: var(--ui-font);
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid var(--border);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }
  .has-tooltip:hover::after { opacity: 1; }
  .btn-tiny {
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--ui-font);
    transition: 0.15s;
  }
  .btn-tiny:hover { color: var(--text); border-color: var(--accent2); }

  /* ── QUIZ ── */
  .quiz-progress {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .quiz-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .quiz-meta {
    display: flex;
    justify-content: space-between;
    width: 100%;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .quiz-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 180px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .quiz-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(124,106,247,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .quiz-kana {
    font-family: var(--jp-font);
    font-size: clamp(4rem, 15vw, 7rem);
    line-height: 1;
    color: var(--text);
    animation: fadeUp 0.3s ease;
  }

  .quiz-romaji {
    font-family: 'DM Mono', monospace;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.05em;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .quiz-hint {
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
  }

  .options-grid {
    width: 100%;
    display: grid;
    gap: 10px;
  }

  .opt-btn {
    width: 100%;
    padding: 16px 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--jp-font);
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .opt-btn .opt-romaji {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    color: var(--muted);
  }

  .opt-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent2);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(124,106,247,0.2);
  }

  .opt-btn.correct {
    background: rgba(76,175,130,0.18);
    border-color: var(--correct);
    color: var(--correct);
  }
  .opt-btn.wrong {
    background: rgba(224,92,106,0.18);
    border-color: var(--wrong);
    color: var(--wrong);
  }
  .opt-btn:disabled { cursor: default; transform: none !important; }

  /* results */
  .result-big {
    font-family: var(--jp-font);
    font-size: 5rem;
    line-height: 1;
    color: var(--accent);
  }
  .result-label { color: var(--muted); font-size: 0.9rem; letter-spacing: 0.1em; }
  .result-score {
    font-size: 1.1rem;
    text-align: center;
    line-height: 1.8;
  }

  /* back btn */
  .back-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--ui-font);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s;
    align-self: flex-start;
  }
  .back-btn:hover { color: var(--text); }

  .warn {
    color: var(--wrong);
    font-size: 0.88rem;
    font-weight: 600;
    text-align: center;
    padding: 10px 16px;
    background: rgba(224,92,106,0.1);
    border: 1px solid rgba(224,92,106,0.3);
    border-radius: 10px;
    display: none;
  }
  .warn.show { display: block; }

  /* ── LANG TOGGLE ── */
  .lang-toggle {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
  }
  .lang-btn {
    padding: 8px 22px;
    border: none;
    background: none;
    color: var(--muted);
    font-family: var(--ui-font);
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }
  .lang-btn.active {
    background: var(--accent2);
    color: var(--text);
  }

  /* ── FONT PICKER ── */
  .font-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .font-opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .font-opt:hover { border-color: var(--accent2); }
  .font-opt.active {
    background: rgba(124,106,247,0.15);
    border-color: var(--accent2);
  }
  .font-opt-preview {
    font-size: 1.4rem;
    line-height: 1;
  }
  .font-opt-label {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: var(--ui-font);
  }
  .font-opt.active .font-opt-label { color: var(--accent2); }

  /* ── SECTION TOGGLE (hiragana / katakana) ── */
  .section-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .section-btn {
    padding: 5px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .section-btn.active {
    background: rgba(124,106,247,0.18);
    border-color: var(--accent2);
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="logo">日本語<span>quiz</span></div>
</header>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="home-title">Learn<br><em>Japanese</em></div>
  <p class="home-sub" data-t="home_sub">Тренируй японскую азбуку — иероглиф за иероглифом</p>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="startQuiz()">▶ <span data-t="start">Начать тест</span></button>
    <button class="btn btn-secondary" onclick="showSettings()">⚙ <span data-t="settings">Настройки</span></button>
  </div>
</div>

<!-- SETTINGS -->
<div class="screen" id="screen-settings">
  <button class="back-btn" onclick="showHome()">← <span data-t="back">назад</span></button>

  <div class="settings-row">
    <div class="settings-card">
      <div class="settings-title" data-t="lang_title">Язык интерфейса</div>
      <div class="lang-toggle">
        <button class="lang-btn active" id="lang-ru" onclick="setLang('ru')">Русский</button>
        <button class="lang-btn" id="lang-en" onclick="setLang('en')">English</button>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-title" data-t="opts_title">Вариантов ответа</div>
      <div class="range-row">
        <input type="range" id="opt-count" min="2" max="10" value="4"
               oninput="document.getElementById('opt-val').textContent=this.value">
        <div class="range-val" id="opt-val">4</div>
      </div>
    </div>
  </div>

  <div class="settings-row">
    <div class="settings-card">
      <div class="settings-title" data-t="q_count_title">Кол-во вопросов</div>
      <div class="range-row">
        <input type="range" id="q-count" min="10" max="30" value="10" step="5"
               oninput="document.getElementById('q-count-val').textContent=this.value">
        <div class="range-val" id="q-count-val">10</div>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-title" data-t="font_title">Шрифт</div>
      <div class="font-options" id="font-options"></div>
    </div>
  </div>

  <div class="settings-card">
    <div class="kana-card-header">
      <div class="settings-title" data-t="kana_title" style="margin-bottom:0">Активные иероглифы</div>
      <div class="view-toggle">
        <!-- Normal/expanded: 4 large squares — DEFAULT -->
        <button class="view-btn active has-tooltip" id="view-normal" onclick="setView('normal')" data-tip="Подробно" data-t-tip="view_expanded">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1"  y="1"  width="8" height="8" rx="2" fill="currentColor" opacity="0.9"/>
            <rect x="11" y="1"  width="8" height="8" rx="2" fill="currentColor" opacity="0.9"/>
            <rect x="1"  y="11" width="8" height="8" rx="2" fill="currentColor" opacity="0.9"/>
            <rect x="11" y="11" width="8" height="8" rx="2" fill="currentColor" opacity="0.9"/>
          </svg>
        </button>
        <!-- Compact: 9 small squares (rows layout) -->
        <button class="view-btn has-tooltip" id="view-compact" onclick="setView('compact')" data-tip="Компактно" data-t-tip="view_compact">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1"   y="1"   width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="7.5" y="1"   width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="14"  y="1"   width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="1"   y="7.5" width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="7.5" y="7.5" width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="14"  y="7.5" width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="1"   y="14"  width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="7.5" y="14"  width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="14"  y="14"  width="5" height="5" rx="1.5" fill="currentColor" opacity="0.9"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="grid-label" data-t="kana_hint" style="margin-top:12px">Нажми чтобы включить / выключить</p>
    <div class="section-toggle">
      <button class="section-btn active" id="sec-hiragana" onclick="setSection('hiragana')">ひらがな</button>
      <button class="section-btn" id="sec-katakana" onclick="setSection('katakana')">カタカナ</button>
    </div>
    <div class="kana-grid" id="kana-grid"></div>
    <div class="grid-actions">
      <button class="btn-tiny" data-t="select_all" onclick="toggleAll(true)">Выбрать все</button>
      <button class="btn-tiny" data-t="deselect_all" onclick="toggleAll(false)">Снять все</button>
    </div>
  </div>

  <div class="warn" id="warn-min" data-t="warn_min">Нужно минимум 3 активных иероглифа</div>
  <button class="btn btn-primary" onclick="startQuiz()">▶ <span data-t="start">Начать тест</span></button>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <button class="back-btn" onclick="showHome()">← <span data-t="exit">выйти</span></button>
  <div class="quiz-progress"><div class="quiz-progress-bar" id="q-bar"></div></div>
  <div class="quiz-meta">
    <span id="q-num">1 / 10</span>
    <span id="q-score">✓ 0</span>
  </div>
  <div class="quiz-card">
    <div id="q-display"></div>
  </div>
  <p class="quiz-hint" id="q-hint"></p>
  <div class="options-grid" id="options-grid"></div>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="result-big" id="res-emoji">🎉</div>
  <div class="result-label" data-t="result_label">РЕЗУЛЬТАТ</div>
  <div class="result-score" id="res-score"></div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="startQuiz()">▶ <span data-t="again">Ещё раз</span></button>
    <button class="btn btn-secondary" onclick="showHome()"><span data-t="menu">Меню</span></button>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────
const HIRAGANA = [

    opts_title:  'Answer options',

let lang = 'ru';

function setLang(l) {
  lang = l;
  localStorage.setItem('hq_lang', l);
  document.getElementById('lang-ru').classList.toggle('active', l === 'ru');
  document.getElementById('lang-en').classList.toggle('active', l === 'en');
  // update all data-t text elements
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.dataset.t;
    if (T[l][key] && typeof T[l][key] === 'string') el.textContent = T[l][key];
  });
  // update tooltip data-tip attributes
  document.querySelectorAll('[data-t-tip]').forEach(el => {
    const key = el.dataset.tTip;
    if (T[l][key]) el.dataset.tip = T[l][key];
  });
  // rebuild font picker labels
  const fp = document.getElementById('font-options');
  if (fp && fp.children.length > 0) buildFontPicker();
}

function t(key, ...args) {
  const val = T[lang][key];
  return typeof val === 'function' ? val(...args) : val;
}


let active = new Set(ALL_KANA.map((_,i)=>i).filter(i => i < HIRA_END)); // hiragana on by default
let quizList = [], qIdx = 0, score = 0, totalQ = 10, optCount = 4;
let currentSection = 'hiragana'; // 'hiragana' | 'katakana'

// ── FONTS ──────────────────────────────────────────────────
const FONTS = [
  { id: 'noto-serif',   family: "'Noto Serif JP', serif",       labelRu: 'Печатный',      labelEn: 'Serif',       preview: 'あアかカ' },
  { id: 'noto-sans',    family: "'Noto Sans JP', sans-serif",    labelRu: 'Без засечек',   labelEn: 'Sans-serif',  preview: 'あアかカ' },
  { id: 'rounded',      family: "'M PLUS Rounded 1c', sans-serif",labelRu: 'Округлый',     labelEn: 'Rounded',     preview: 'あアかカ' },
  { id: 'handwritten',  family: "'Zen Kurenaido', sans-serif",   labelRu: 'Рукописный',    labelEn: 'Handwritten', preview: 'あアかカ' },
  { id: 'calligraphy',  family: "'Kaisei Decol', serif",         labelRu: 'Каллиграфия',   labelEn: 'Calligraphy', preview: 'あアかカ' },
];
let currentFont = 'noto-serif';

function buildFontPicker() {
  const container = document.getElementById('font-options');
  container.innerHTML = '';
  FONTS.forEach(f => {
    const el = document.createElement('div');
    el.className = 'font-opt' + (f.id === currentFont ? ' active' : '');
    el.onclick = () => setFont(f.id);
    el.innerHTML = `
      <span class="font-opt-preview" style="font-family:${f.family}">${f.preview}</span>
      <span class="font-opt-label">${lang === 'ru' ? f.labelRu : f.labelEn}</span>
    `;
    container.appendChild(el);
  });
}

function setFont(id) {
  currentFont = id;
  const f = FONTS.find(f => f.id === id);
  document.documentElement.style.setProperty('--jp-font', f.family);
  localStorage.setItem('hq_font', id);
  buildFontPicker();
}

function save() {
  localStorage.setItem('hq_active', JSON.stringify([...active]));
  localStorage.setItem('hq_opts', document.getElementById('opt-count').value);
  localStorage.setItem('hq_qcount', document.getElementById('q-count').value);
  localStorage.setItem('hq_lang', lang);
  localStorage.setItem('hq_font', currentFont);
}

function load() {
  const a = localStorage.getItem('hq_active');
  if (a) active = new Set(JSON.parse(a));
  const o = localStorage.getItem('hq_opts');
  if (o) { document.getElementById('opt-count').value = o; document.getElementById('opt-val').textContent = o; }
  const qc = localStorage.getItem('hq_qcount');
  if (qc) { document.getElementById('q-count').value = qc; document.getElementById('q-count-val').textContent = qc; }
  const v = localStorage.getItem('hq_view');
  if (v) setView(v);
  const l = localStorage.getItem('hq_lang');
  if (l) setLang(l);
  const fnt = localStorage.getItem('hq_font');
  if (fnt) setFont(fnt);
}

// ── GRID ──────────────────────────────────────────────────
const ROW_SHORT_H = {"あ行":"あ","か行":"か","さ行":"さ","た行":"た","な行":"な","は行":"は","ま行":"ま","や行":"や","ら行":"ら","わ行":"わ","ん":"ん"};
const ROW_SHORT_K = {"ア行":"ア","カ行":"カ","サ行":"サ","タ行":"タ","ナ行":"ナ","ハ行":"ハ","マ行":"マ","ヤ行":"ヤ","ラ行":"ラ","ワ行":"ワ","ン":"ン"};

function setSection(sec) {
  currentSection = sec;
  document.getElementById('sec-hiragana').classList.toggle('active', sec === 'hiragana');
  document.getElementById('sec-katakana').classList.toggle('active', sec === 'katakana');
  buildGrid();
}

function getSectionData() {
  if (currentSection === 'hiragana') return { data: HIRAGANA, offset: 0, rowShort: ROW_SHORT_H };
  return { data: KATAKANA, offset: HIRA_END, rowShort: ROW_SHORT_K };
}

function makeKanaBtn(i) {
  const [, k, r] = ALL_KANA[i];
  const btn = document.createElement('div');
  btn.className = 'kana-btn ' + (active.has(i) ? 'on' : 'off');
  btn.innerHTML = `<span class="k">${k}</span><span class="r">${r}</span>`;
  btn.dataset.idx = i;
  btn.onclick = () => toggleKana(i, btn);
  return btn;
}

function buildGrid() {
  const { data, offset, rowShort } = getSectionData();
  const grid = document.getElementById('kana-grid');
  grid.innerHTML = '';
  grid.classList.toggle('compact', viewMode === 'compact');

  if (viewMode === 'compact') {
    const groups = [];
    let cur = null;
    data.forEach(([grp], di) => {
      if (!cur || cur.grp !== grp) { cur = { grp, items: [] }; groups.push(cur); }
      cur.items.push(offset + di);
    });
    groups.forEach(({ grp, items }) => {
      const row = document.createElement('div');
      row.className = 'kana-row';
      const lbl = document.createElement('div');
      lbl.className = 'kana-row-label';
      lbl.textContent = rowShort[grp] || grp;
      row.appendChild(lbl);
      items.forEach(i => row.appendChild(makeKanaBtn(i)));
      grid.appendChild(row);
    });
  } else {
    let lastGroup = null;
    data.forEach(([grp], di) => {
      const i = offset + di;
      if (grp !== lastGroup) {
        const lbl = document.createElement('div');
        lbl.className = 'kana-group-label';
        lbl.textContent = grp;
        grid.appendChild(lbl);
        lastGroup = grp;
      }
      grid.appendChild(makeKanaBtn(i));
    });
  }
}

function toggleKana(i, btn) {
  if (active.has(i)) { active.delete(i); btn.className = 'kana-btn off'; }
  else { active.add(i); btn.className = 'kana-btn on'; }
  save();
}

function toggleAll(on) {
  const { data, offset } = getSectionData();
  data.forEach((_, di) => {
    const i = offset + di;
    if (on) active.add(i); else active.delete(i);
  });
  buildGrid(); save();
}

// ── VIEW MODE ──────────────────────────────────────────────
let viewMode = 'normal';

function setView(mode) {
  viewMode = mode;
  localStorage.setItem('hq_view', mode);
  document.getElementById('view-normal').classList.toggle('active', mode === 'normal');
  document.getElementById('view-compact').classList.toggle('active', mode === 'compact');
  // rebuild grid if settings screen is open
  const grid = document.getElementById('kana-grid');
  if (grid.children.length > 0) buildGrid();
}

// ── SCREENS ──────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showHome() { show('screen-home'); }
function showSettings() { buildGrid(); buildFontPicker(); show('screen-settings'); }

// ── QUIZ ──────────────────────────────────────────────────
function startQuiz() {
  const warn = document.getElementById('warn-min');
  optCount = parseInt(document.getElementById('opt-count').value);
  const qMax = parseInt(document.getElementById('q-count').value);

  if (active.size < 3) { warn.classList.add('show'); return; }
  warn.classList.remove('show');
  if (active.size < optCount) optCount = active.size;

  const pool = [...active];
  quizList = shuffle(pool).slice(0, Math.min(qMax, pool.length));
  qIdx = 0; score = 0;
  totalQ = quizList.length;
  show('screen-quiz');
  renderQ();
}

function renderQ() {
  const bar = document.getElementById('q-bar');
  bar.style.width = (qIdx / totalQ * 100) + '%';
  document.getElementById('q-num').textContent = `${qIdx+1} / ${totalQ}`;
  document.getElementById('q-score').textContent = `✓ ${score}`;

  const idx = quizList[qIdx];
  const [, kana, romaji] = ALL_KANA[idx];

  // randomly show kana or romaji as prompt
  const showKana = Math.random() < 0.5;
  const display = document.getElementById('q-display');
  const hint = document.getElementById('q-hint');

  if (showKana) {
    display.innerHTML = `<div class="quiz-kana">${kana}</div>`;
    hint.textContent = t('hint_pick_romaji');
  } else {
    display.innerHTML = `<div class="quiz-romaji">${romaji}</div>`;
    hint.textContent = t('hint_pick_kana');
  }

  // build options: correct + random wrong
  const pool = [...active].filter(i => i !== idx);
  const wrongs = shuffle(pool).slice(0, optCount - 1);
  const opts = shuffle([idx, ...wrongs]);

  const grid = document.getElementById('options-grid');
  const cols = optCount <= 4 ? Math.min(optCount, 2) : optCount <= 6 ? 3 : 4;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  opts.forEach(oi => {
    const [, ok, or] = ALL_KANA[oi];
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.dataset.idx = oi;
    if (showKana) {
      // вопрос — иероглиф → ответы только транскрипция
      btn.innerHTML = `<span class="opt-romaji">${or}</span>`;
    } else {
      // вопрос — транскрипция → ответы только иероглиф
      btn.innerHTML = `<span>${ok}</span>`;
    }
    btn.onclick = () => answer(btn, oi === idx);
    grid.appendChild(btn);
  });
}

function answer(btn, correct) {
  const grid = document.getElementById('options-grid');
  grid.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (correct) score++;

  // если ошиблись — подсветить правильный
  if (!correct) {
    const correctIdx = quizList[qIdx];
    grid.querySelectorAll('.opt-btn').forEach(b => {
      if (parseInt(b.dataset.idx) === correctIdx) b.classList.add('correct');
    });
  }

  setTimeout(() => {
    qIdx++;
    if (qIdx >= totalQ) showResult();
    else renderQ();
  }, 900);
}

function showResult() {
  document.getElementById('q-bar').style.width = '100%';
  const pct = Math.round(score / totalQ * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 50 ? '😊' : '😅';
  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-score').innerHTML =
    t('score_of', score, totalQ) + `<br>${pct}%`;
  show('screen-result');
}

// ── UTILS ──────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ── INIT ──────────────────────────────────────────────────
load();
</script>
